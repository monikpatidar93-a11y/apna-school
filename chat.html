<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Private Chat</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f0f4f8;
}
.chat-box{
max-width:650px;
margin:30px auto;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}
.header{
background:#0077b6;
color:white;
padding:12px;
text-align:center;
}
.messages{
height:350px;
overflow-y:auto;
padding:10px;
}
.msg{
margin:6px 0;
padding:8px 12px;
border-radius:6px;
max-width:70%;
}
.me{
background:#0077b6;
color:white;
margin-left:auto;
}
.other{
background:#caf0f8;
}
.input-area{
display:flex;
border-top:1px solid #ccc;
}
input{
flex:1;
padding:10px;
border:none;
outline:none;
}
button{
padding:10px 15px;
border:none;
background:#0077b6;
color:white;
cursor:pointer;
}
.top-bar{
display:flex;
padding:10px;
gap:10px;
}
</style>
</head>

<body>

<script>
const currentUser = JSON.parse(localStorage.getItem("currentUser"));
if(!currentUser){
alert("Login first");
window.location.href="login.html";
}
</script>

<div class="chat-box">

<div class="header">Private Chat</div>

<div class="top-bar">
<input id="friendEmail" placeholder="Enter Friend Email">
<button onclick="startChat()">Start Chat</button>
</div>

<div class="messages" id="messages"></div>

<div class="input-area">
<input id="msg" placeholder="Type message...">
<button onclick="sendMsg()">Send</button>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, onChildAdded } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* YOUR FIREBASE CONFIG */
const firebaseConfig = {
apiKey: "AIzaSyC_0-GLqcdOy4a_0RyH86cgU6UAZBeeKMM",
authDomain: "apna-school-chat.firebaseapp.com",
projectId: "apna-school-chat",
storageBucket: "apna-school-chat.firebasestorage.app",
messagingSenderId: "613723417838",
appId: "1:613723417838:web:18986256b01a3e5fab57ff"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let chatRef = null;

/* CREATE ROOM */
window.startChat = function(){
const friend = friendEmail.value.trim();
if(friend==""){ alert("Enter friend email"); return; }

const roomId = 
currentUser.email.replace(/[@.]/g,"") + "_" +
friend.replace(/[@.]/g,"");

chatRef = ref(db,"privateChats/"+roomId);

messages.innerHTML="";
alert("Chat Started with "+friend);
}

/* SEND MESSAGE */
window.sendMsg = function(){
if(!chatRef){
alert("Start chat first");
return;
}

const text = msg.value.trim();
if(text=="") return;

push(chatRef,{
from: currentUser.email,
message: text
});
msg.value="";
}

/* RECEIVE */
function listenChat(){
if(!chatRef) return;

onChildAdded(chatRef,(data)=>{
const d=data.val();

const div=document.createElement("div");
div.className="msg "+ 
(d.from==currentUser.email?"me":"other");
div.innerText=d.message;

messages.appendChild(div);
messages.scrollTop=messages.scrollHeight;
});
}

window.startChat = function(){
const friend = friendEmail.value.trim();
if(friend==""){ alert("Enter friend email"); return; }

const id1=currentUser.email.replace(/[@.]/g,"");
const id2=friend.replace(/[@.]/g,"");

const roomId = id1<id2 ? id1+"_"+id2 : id2+"_"+id1;

chatRef = ref(db,"privateChats/"+roomId);
messages.innerHTML="";
listenChat();
alert("Connected with "+friend);
}

</script>

</body>
</html>
