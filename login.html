<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<style>
body{ font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f4f8; }
.container{ background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.2); }
input{ display:block; width:100%; padding:10px; margin:10px 0; border-radius:6px; border:1px solid #0077b6; }
button{ padding:10px 15px; border:none; background:#0077b6; color:white; cursor:pointer; border-radius:6px; }
button:hover{ background:#0096c7; }
a{ text-decoration:none; color:#0077b6; }
</style>
</head>
<body>
<div class="container">
<h2>Login</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>
<p>Don't have account? <a href="signup.html">Sign Up</a></p>
</div>

<script>
function login(){
    const email=document.getElementById('email').value.trim();
    const password=document.getElementById('password').value;

    let users=JSON.parse(localStorage.getItem('users')) || [];
    const user=users.find(u=>u.email===email && u.password===password);
    if(user){
        localStorage.setItem('currentUser', JSON.stringify(user));
        alert('Login Successful! Welcome '+user.name);
        window.location.href='index.html';
    } else{
        alert('Invalid email or password');
    }
}
</script>
</body>
</html>
